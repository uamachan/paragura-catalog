<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ぱらぐら 車両カタログ (VDM・高級車ディーラー)</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--text:#e8eaf0;--sub:#9aa1ad;--acc:#4da3ff;--lux:#d9b25f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}h1 small{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.tab,.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}.tab.lux.on{background:var(--lux);border-color:var(--lux);color:#1a1405}
.chip{padding:4px 10px;font-size:12px}.chip.on{border-color:var(--acc);color:var(--acc)}
input,select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px}
input{flex:1;min-width:180px}.count{color:var(--sub);font-size:12px}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:150px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a2f3a,#14161b);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain}.ph .no{color:var(--sub);font-size:12px}
.info{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.name{font-weight:600;font-size:14px}.spawn{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--sub);cursor:pointer}
.spawn:hover{color:var(--acc)}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.cat{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.price{font-weight:700;font-size:15px;color:#7fd58a}.lux .price{color:var(--lux)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222833;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
</style></head><body>
<header>
<h1>車両カタログ<small id="asof"></small></h1>
<div class="row">
<button class="tab on" data-shop="vdm">VDM (一般ディーラー)</button>
<button class="tab lux" data-shop="luxury">高級車ディーラー</button>
<input id="q" placeholder="車名・spawn名で検索">
<select id="sort"><option value="pa">価格 安い順</option><option value="pd">価格 高い順</option><option value="n">名前順</option></select>
<span class="count" id="count"></span>
</div>
<div class="row" id="cats"></div>
</header>
<main id="grid"></main>
<div id="toast"></div>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
document.getElementById('asof').textContent='2026-11-11 時点 / VDM '+D.filter(r=>r.type==='vdm').length+'台・高級車 '+D.filter(r=>r.type==='luxury').length+'台';
const L={compacts:'コンパクト',sedans:'セダン',suvs:'SUV',coupes:'クーペ',muscle:'マッスル',sportsclassics:'スポーツクラシック',sports:'スポーツ',super:'スーパー',motorcycles:'バイク',offroad:'オフロード',vans:'バン',commercial:'商用',mod_compact:'コンパクト',mod_sedan:'セダン',mod_suv:'SUV',mod_muscle:'マッスル',mod_classic:'クラシック',mod_sports:'スポーツ',mod_super:'スーパー',mod_bike:'バイク',mod_van:'バン',mod_novelty:'ユニーク'};
const lab=c=>L[c]||c;
let shop='vdm',cat='all';
const yen=n=>{if(n>=1e8){const o=Math.floor(n/1e8),m=Math.round(n%1e8/1e4);return o+'億'+(m?m+'万':'')+'円'}return (n/1e4).toLocaleString()+'万円'};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=e.target;i.src=i.dataset.src;io.unobserve(i)}}),{rootMargin:'400px'});
function cats(){const cs=[...new Set(D.filter(r=>r.type===shop).map(r=>r.cat))];const order=Object.keys(L);cs.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
const el=document.getElementById('cats');el.innerHTML='';[['all','すべて'],...cs.map(c=>[c,lab(c)])].forEach(([c,t])=>{const n=c==='all'?D.filter(r=>r.type===shop).length:D.filter(r=>r.type===shop&&r.cat===c).length;
const b=document.createElement('button');b.className='chip'+(c===cat?' on':'');b.textContent=t+' ('+n+')';b.onclick=()=>{cat=c;cats();render()};el.appendChild(b)})}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),s=document.getElementById('sort').value;
let r=D.filter(v=>v.type===shop&&(cat==='all'||v.cat===cat)&&(!q||v.name.toLowerCase().includes(q)||v.id.toLowerCase().includes(q)));
r.sort(s==='pa'?(a,b)=>a.max-b.max:s==='pd'?(a,b)=>b.max-a.max:(a,b)=>a.name.localeCompare(b.name));
const g=document.getElementById('grid');g.className=shop==='luxury'?'lux':'';g.innerHTML='';
document.getElementById('count').textContent=r.length+'台';
if(!r.length){g.innerHTML='<div class="empty">該当する車がありません</div>';return}
const f=document.createDocumentFragment();
r.forEach(v=>{const c=document.createElement('div');c.className='card';
c.innerHTML='<div class="ph">'+(v.img?'<img alt="">':'<span class="no">画像なし</span>')+'</div><div class="info"><div class="name"></div><div class="spawn" title="クリックでコピー"></div><div class="meta"><span class="cat"></span><span class="price"></span></div></div>';
c.querySelector('.name').textContent=v.name;const sp=c.querySelector('.spawn');sp.textContent=v.id;sp.onclick=()=>{navigator.clipboard.writeText(v.id).then(()=>toast(v.id+' をコピーしました')).catch(()=>{})};
c.querySelector('.cat').textContent=lab(v.cat);c.querySelector('.price').textContent=yen(v.max);
if(v.img){const i=c.querySelector('img');i.dataset.src=v.img;io.observe(i)}f.appendChild(c)});g.appendChild(f)}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1500)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{shop=b.dataset.shop;cat='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));cats();render();scrollTo(0,0)});
document.getElementById('q').oninput=render;document.getElementById('sort').onchange=render;
cats();render();
</script></body></html>
